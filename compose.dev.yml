services:
  api:
    build: .
    ports:
      - "4000:4000"
    volumes:
      - ./data:/app/data
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
      DATABASE_URL: sqlite://data/traefik.db
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:?set password on first start}
