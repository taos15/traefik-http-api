services:
  api:
    build: .
    container_name: traefik-http-api
    networks:
      - traefik
    ports:
      - "4000:4000"
    volumes:
      - ./data:/app/data
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false
      # For SSH: mount a read-only SSH config/key/known_hosts directory as needed.
      # For mTLS: mount client certificate paths read-only.
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
      DATABASE_URL: sqlite://data/traefik.db
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      TRAEFIK_API_URL: ${TRAEFIK_API_URL:-}
      TRAEFIK_API_USERNAME: ${TRAEFIK_API_USERNAME:-}
      TRAEFIK_API_PASSWORD: ${TRAEFIK_API_PASSWORD:-}
      TRAEFIK_API_PASSWORD_FILE: ${TRAEFIK_API_PASSWORD_FILE:-}
      PROVIDER_TOKEN: ${PROVIDER_TOKEN:-}
networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-proxynet}
