name: Rust checks
on:
  push:
    branches-ignore: [master]
    tags-ignore: ['**']
  pull_request:
  workflow_call:
    inputs:
      skip-docker:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --features server -- -D warnings
      - run: cargo test --features server
      - run: cargo check --no-default-features --features web --target wasm32-unknown-unknown
      - if: ${{ !inputs.skip-docker }}
        run: docker build .
