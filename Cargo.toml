[package]
name = "traefik-http-api"
version = "0.1.0"
edition = "2024"

[features]
default = ["server"]
server = ["dep:tokio", "dep:axum", "dep:tower-http", "dep:tower", "dep:sqlx", "dep:bollard", "dep:argon2", "dep:rand", "dep:tracing", "dep:tracing-subscriber", "dep:futures", "dep:uuid", "dep:subtle", "dep:anyhow", "dep:sha2", "dep:hex"]
web = ["dep:dioxus", "dep:gloo-net", "dep:web-sys"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tokio = { version = "1", features = ["full"], optional = true }
axum = { version = "0.8", features = ["macros", "json"], optional = true }
tower-http = { version = "0.6", features = ["trace", "fs"], optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "derive", "macros"], optional = true }
bollard = { version = "0.20", default-features = false, features = ["http", "pipe", "ssl", "ssh", "aws-lc-rs"], optional = true }
argon2 = { version = "0.5", optional = true }
rand = { version = "0.8", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
futures = { version = "0.3", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
subtle = { version = "2", optional = true }
anyhow = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
dioxus = { version = "0.7.10", default-features = false, features = ["web", "router", "lib", "launch"], optional = true }
gloo-net = { version = "0.6", features = ["json"], optional = true }
web-sys = { version = "0.3", features = ["Window", "Location"], optional = true }

[[bin]]
name = "traefik-server"
path = "src/main.rs"
required-features = ["server"]

[[bin]]
name = "traefik-web"
path = "src/web.rs"
required-features = ["web"]
