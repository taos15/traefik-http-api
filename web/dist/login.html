<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in</title><link rel="stylesheet" href="/app.css"></head><body><main class="login panel"><h1>Sign in</h1><form id="login"><label>Username <input name="username" required autocomplete="username"></label><label>Password <input name="password" type="password" required autocomplete="current-password"></label><button>Sign in</button><p class="error" id="error"></p></form></main><script>document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const form=new FormData(e.target);const res=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:form.get('username'),password:form.get('password')})});if(res.ok)location.href='/';else document.getElementById('error').textContent='Invalid credentials';});</script></body></html>
